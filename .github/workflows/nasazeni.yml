name: Nasazení na Hetzner

# Spouští jen majitel ručně: Actions → Nasazení na Hetzner → Run workflow.
# Režim „zkouska“ nic nenahrává, jen vypíše, co by se nahrálo. Nic se nenasazuje samo.
#
# Secrets:   FTP_USERNAME, FTP_PASSWORD (FTP účet omezený jen na složku humanoida), ROBOT_HESLO (heslo do simulátoru, min. 10 znaků),
#            PREPOCET_TOKEN (nepovinný: token GitHubu jen pro repozitář humanoid, Actions: read and write, Contents: read)
# Variables: FTP_SERVER (výchozí www748.your-server.de), FTP_SERVER_DIR (výchozí /, vždy s lomítkem na konci)

on:
  workflow_dispatch:
    inputs:
      rezim:
        description: "zkouska = nic se nenahraje, nasazeni = nahrát na server"
        type: choice
        options: [zkouska, nasazeni]
        default: zkouska

permissions:
  contents: read

concurrency:
  group: nasazeni
  cancel-in-progress: false

jobs:
  nasazeni:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ vars.FTP_SERVER || 'www748.your-server.de' }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      ROBOT_HESLO: ${{ secrets.ROBOT_HESLO }}
      PREPOCET_TOKEN: ${{ secrets.PREPOCET_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Kontrola
        run: bash .github/kontrola.sh
      - name: Kontrola nastavení
        run: |
          test -n "$FTP_USERNAME" || { echo "Chybí secret FTP_USERNAME"; exit 1; }
          test -n "$LFTP_PASSWORD" || { echo "Chybí secret FTP_PASSWORD"; exit 1; }
          if [ "${#ROBOT_HESLO}" -lt 10 ]; then
            if [ "${{ inputs.rezim }}" = "nasazeni" ]; then echo "Secret ROBOT_HESLO chybí nebo má méně než 10 znaků"; exit 1; fi
            echo "::warning::Secret ROBOT_HESLO chybí – zkouška poběží s náhradním heslem, ostré nasazení se bez něj nespustí."
            echo "ROBOT_HESLO=zkouska-bez-hesla-$RANDOM$RANDOM" >> "$GITHUB_ENV"
          fi
          case "$FTP_SERVER_DIR" in */) ;; *) echo "FTP_SERVER_DIR musí končit lomítkem"; exit 1;; esac
      - name: Otisk hesla (vzniká jen tady, do repozitáře se nedostane)
        run: |
          php -r 'file_put_contents("web/soukrome/tajne.php","<?php return ".var_export(["hash"=>password_hash(getenv("ROBOT_HESLO"),PASSWORD_DEFAULT),"gh"=>(string)getenv("PREPOCET_TOKEN")],true).";\n");'
          [ -n "$PREPOCET_TOKEN" ] || echo "::warning::Secret PREPOCET_TOKEN chybí – tlačítko Odeslat k přepočtu v simulátoru nebude fungovat."
          php -l web/soukrome/tajne.php
      - name: lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Pojistka – cílová složka musí patřit jen humanoidovi
        run: |
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set cmd:fail-exit true;
            cls -1a $FTP_SERVER_DIR; bye" > obsah.txt 2> chyba.txt || {
              cat chyba.txt; echo "::error::Přihlášení k FTP selhalo nebo cílová složka neexistuje. Zkontroluj secrets FTP_USERNAME a FTP_PASSWORD (konsoleH → FTP účty) a proměnnou FTP_SERVER_DIR."; exit 1; }
          if grep -q -i "login failed\|530" chyba.txt; then cat chyba.txt; echo "::error::Server odmítl přihlášení k FTP."; exit 1; fi
          echo "Obsah cílové složky:"; cat obsah.txt
          if grep -E -i '(^|/)(public_html|kliphaus|caribhaus|harmonie|jogaseberozvoje|sunbeha|kliphaus-data|caribhaus-poptavky|logs|backup)/?$' obsah.txt; then
            echo "::error::Cílová složka obsahuje jiné weby – FTP účet není omezený jen na humanoida. Nasazení zastaveno."; exit 1; fi
          if grep -q -E '(^|/)(wp-config\.php|crm|obchod)/?$' obsah.txt; then echo "::error::Cílová složka vypadá jako jiný web. Nasazení zastaveno."; exit 1; fi
          rm -f obsah.txt chyba.txt
      - name: ${{ inputs.rezim == 'nasazeni' && 'Nahrání na server' || 'Zkouška (nic se nenahrává)' }}
        run: |
          ZK=""; [ "${{ inputs.rezim }}" = "nasazeni" ] || ZK="--dry-run"
          # Bez --delete: na serveru se nic nemaže. Relace a počítadlo pokusů zůstávají na serveru.
          lftp --env-password -u "$FTP_USERNAME" "$FTP_SERVER" -e "
            set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;
            set net:max-retries 3; set net:timeout 30; set cmd:fail-exit true;
            mirror -R $ZK --verbose --no-perms --exclude-glob soukrome/relace/ --exclude-glob soukrome/pokusy.json --exclude-glob soukrome/prepocty.json web/ $FTP_SERVER_DIR;
            bye"
      - name: Souhrn
        run: echo "Režim ${{ inputs.rezim }} · commit ${GITHUB_SHA::7} · cíl $FTP_SERVER$FTP_SERVER_DIR" >> "$GITHUB_STEP_SUMMARY"
