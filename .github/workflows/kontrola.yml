name: Kontrola
on:
  push:
  pull_request:
  workflow_dispatch:   # spouští i workflow Nová revize po svém commitu (commit přes GITHUB_TOKEN push událost nevyvolá)
permissions:
  contents: read
jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash .github/kontrola.sh
